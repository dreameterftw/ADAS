services:
  - type: web
    name: adas-backend
    env: python
    region: singapore
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "PYTHONPATH=src uvicorn adas.api.main:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: ALLOWED_ORIGINS
        value: "https://adas-nav.web.app,https://adas-nav.firebaseapp.com,http://localhost:5173,http://127.0.0.1:5173"
      - key: FRONTEND_URL
        value: "https://adas-nav.web.app"
